<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RoboRooster FTC Team #32819 | Robotics Team Stuttgart</title>
	<meta name="description" content="Official website of RoboRooster #32819, a premier FTC robotics team from Stuttgart. Discover our award-winning robot design, innovative software engineering, and our mission to inspire the next generation of STEM leaders.">
	<meta name="robots" content="index, follow">
	<link rel="manifest" href="/manifest.webmanifest">
	<meta name="theme-color" content="#236B43">
	<link rel="canonical" href="https://roborooster.de/">
	<link rel="icon" href="/assets/images/opt/logo.webp" type="image/webp">
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/logo.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo.png">
	<meta property="og:image" content="https://roborooster.de/assets/images/logo.jpg">
	<meta name="twitter:image" content="https://roborooster.de/assets/images/logo.jpg">
	<link rel="preload" as="style" href="/assets/css/templatemo-electric-xtra.css?v=20261121i">
	<link rel="preload" as="script" href="/assets/js/templatemo-electric-scripts.js?v=20261121j">
	<style>
		html, body {
			background: var(--rr-boot-bg, #F3F6EE);
			margin: 0;
			min-height: 100vh;
		}
		.rr-boot-bar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: 3px;
			z-index: 9999;
			background: linear-gradient(90deg, var(--rr-boot-accent, #236B43), #74C69D, var(--rr-boot-accent, #236B43));
			background-size: 200% 100%;
			animation: rrBootSlide 1.1s ease-in-out infinite;
		}
		@keyframes rrBootSlide {
			0% { background-position: 100% 0; }
			100% { background-position: -100% 0; }
		}
	</style>
	<script>
		(function () {
			try {
				if (sessionStorage.getItem('roborooster_season_v3') === 'decode') {
					document.documentElement.style.setProperty('--rr-boot-bg', '#0a0a0f');
					document.documentElement.style.setProperty('--rr-boot-accent', '#B91C1C');
				}
			} catch (e) {}
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
			}
			var lang = '';
			try {
				var u = new URL(window.location.href);
				var ql = (u.searchParams.get('lang') || '').toLowerCase();
				if (ql === 'en' || ql === 'de') {
					lang = ql;
					u.searchParams.delete('lang');
					var s = u.searchParams.toString();
					window.history.replaceState(null, '', '/' + (s ? '?' + s : '') + u.hash);
				}
			} catch (e) {}
			if (!lang) {
				try {
					var cm = document.cookie.match(/(?:^|;\s*)rr_lang=(en|de)(?:;|$)/i);
					if (cm) lang = cm[1].toLowerCase();
				} catch (e) {}
			}
			if (!lang) {
				try {
					var sl = (localStorage.getItem('rr_lang') || '').toLowerCase();
					if (sl === 'en' || sl === 'de') lang = sl;
				} catch (e) {}
			}
			if (!lang) {
				var navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
				lang = navLang.startsWith('de') ? 'de' : 'en';
			}
			try {
				localStorage.setItem('rr_lang', lang);
				document.cookie = 'rr_lang=' + lang + '; Path=/; Max-Age=31536000; SameSite=Lax';
			} catch (e) {}
			fetch('/' + lang + '/index.html', { credentials: 'same-origin', headers: { 'X-RR-Raw': '1' } })
				.then(function (r) {
					if (!r.ok) throw new Error('HTTP ' + r.status);
					return r.text();
				})
				.then(function (html) {
					document.open();
					document.write(html);
					document.close();
				})
				.catch(function () {
					window.location.replace('/' + lang + '/');
				});
		})();
	</script>
	<noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body>
	<div class="rr-boot-bar" aria-hidden="true"></div>
	<noscript><p style="font-family:sans-serif;text-align:center;padding:40px;"><a href="/en/">English</a> | <a href="/de/">Deutsch</a></p></noscript>
</body>
</html>
