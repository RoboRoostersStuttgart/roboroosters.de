<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProType - Advanced Typing Speed Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --correct-color: #34d399;
            --incorrect-color: #f87171;
            --incorrect-bg: rgba(248, 113, 113, 0.2);
            --border-color: #334155;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.15);
            --correct-color: #10b981;
            --incorrect-color: #ef4444;
            --incorrect-bg: rgba(239, 68, 68, 0.15);
            --border-color: #cbd5e1;
        }

        [data-theme="dracula"] {
            --bg-color: #282a36;
            --card-bg: #44475a;
            --text-primary: #f8f8f2;
            --text-secondary: #6272a4;
            --accent-color: #ff79c6;
            --accent-glow: rgba(255, 121, 198, 0.2);
            --correct-color: #50fa7b;
            --incorrect-color: #ff5555;
            --incorrect-bg: rgba(255, 85, 85, 0.25);
            --border-color: #6272a4;
        }

        [data-theme="matrix"] {
            --bg-color: #000000;
            --card-bg: #051c0d;
            --text-primary: #00ff66;
            --text-secondary: #008f39;
            --accent-color: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.2);
            --correct-color: #00ff66;
            --incorrect-color: #ff0033;
            --incorrect-bg: rgba(255, 0, 51, 0.25);
            --border-color: #008f39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: auto;
        }

        /* Header & Controls */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 4px;
            background-color: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .btn-option {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-option.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: 600;
        }

        select.btn-option {
            outline: none;
            font-family: var(--font-main);
        }

        /* Live Stats HUD */
        .hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-color);
        }

        /* Typing Area */
        .typing-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .text-display {
            font-family: var(--font-mono);
            font-size: 1.35rem;
            line-height: 2;
            height: 140px;
            overflow: hidden;
            position: relative;
            color: var(--text-secondary);
            user-select: none;
            letter-spacing: 0.02em;
        }

        .text-display span {
            position: relative;
        }

        .text-display span.correct {
            color: var(--correct-color);
        }

        .text-display span.incorrect {
            color: var(--incorrect-color);
            background-color: var(--incorrect-bg);
            border-radius: 2px;
        }

        .text-display span.current {
            border-bottom: 2px solid var(--accent-color);
        }

        /* Hidden Input Box */
        #word-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        /* Focus Overlay */
        .focus-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            cursor: pointer;
            z-index: 10;
            color: var(--text-primary);
            font-weight: 500;
            gap: 8px;
            transition: opacity 0.2s ease;
        }

        .focus-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .focus-overlay kbd {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-action {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Results Screen */
        .results-container {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .results-container.active {
            display: block;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 32px 0;
        }

        .result-box {
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .result-box .val {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent-color);
            margin-top: 8px;
        }

        /* Chart container */
        .chart-wrapper {
            margin: 20px 0;
            height: 120px;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        .chart-bar {
            flex: 1;
            background-color: var(--accent-color);
            border-radius: 2px 2px 0 0;
            opacity: 0.7;
            transition: height 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                ProType
            </div>
            <div class="controls-bar">
                <div class="control-group" id="mode-selector">
                    <button class="btn-option active" data-mode="time" data-val="30">30s</button>
                    <button class="btn-option" data-mode="time" data-val="60">60s</button>
                    <button class="btn-option" data-mode="words" data-val="25">25w</button>
                    <button class="btn-option" data-mode="words" data-val="50">50w</button>
                </div>
                <div class="control-group">
                    <select class="btn-option" id="category-select" style="background:transparent; border:none; color:var(--text-primary);">
                        <option value="code">Code Snippets</option>
                        <option value="quotes" selected>Famous Quotes</option>
                        <option value="english">Common Words</option>
                    </select>
                </div>
                <div class="control-group">
                    <select class="btn-option" id="theme-select" style="background:transparent; border:none; color:var(--text-primary);">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="dracula">Dracula</option>
                        <option value="matrix">Matrix</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Live HUD Stats -->
        <div class="hud" id="hud-stats">
            <div class="stat-card">
                <div class="stat-label">Time / Words Left</div>
                <div class="stat-value" id="timer-display">30</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">WPM</div>
                <div class="stat-value" id="wpm-display">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Accuracy</div>
                <div class="stat-value" id="acc-display">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Errors</div>
                <div class="stat-value" id="err-display" style="color: var(--incorrect-color);">0</div>
            </div>
        </div>

        <!-- Main Typing Card -->
        <div class="typing-container" id="typing-card">
            <div class="focus-overlay" id="focus-overlay">
                <span>Click here or press any key to focus</span>
                <kbd>Tab</kbd> to restart anytime
            </div>
            <div class="text-display" id="text-display"></div>
            <input type="text" id="word-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>

        <!-- Action Row -->
        <div class="actions">
            <button class="btn-action" id="restart-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
                Restart Test <kbd style="font-size:0.7rem; padding:2px 4px; background:var(--bg-color); border-radius:4px; border:1px solid var(--border-color);">Tab</kbd>
            </button>
        </div>

        <!-- Results Screen -->
        <div class="results-container" id="results-container">
            <h2>Test Completed!</h2>
            <div class="results-grid">
                <div class="result-box">
                    <div class="stat-label">Final WPM</div>
                    <div class="val" id="res-wpm">0</div>
                </div>
                <div class="result-box">
                    <div class="stat-label">Accuracy</div>
                    <div class="val" id="res-acc">0%</div>
                </div>
                <div class="result-box">
                    <div class="stat-label">Characters (C/I)</div>
                    <div class="val" id="res-chars" style="font-size: 1.8rem; margin-top: 14px;">0 / 0</div>
                </div>
            </div>
            <div class="chart-wrapper" id="speed-chart"></div>
            <button class="btn-action" id="res-restart-btn" style="margin: 0 auto;">Try Again</button>
        </div>
    </div>

    <footer>
        ProType &bull; Clean, distraction-free speed tracking engine.
    </footer>

    <script>
        // Datasets
        const datasets = {
            quotes: [
                "The greatest glory in living lies not in never falling, but in rising every time we fall.",
                "The way to get started is to quit talking and begin doing.",
                "If life were predictable it would cease to be life, and be without flavor.",
                "If you look at what you have in life, you'll always have more.",
                "Life is what happens when you're busy making other plans.",
                "Spread love everywhere you go. Let no one ever come to you without leaving happier.",
                "When you reach the end of your rope, tie a knot in it and hang on.",
                "Always remember that you are absolutely unique. Just like everyone else.",
                "Don't judge each day by the harvest you reap but by the seeds that you plant."
            ],
            code: [
                "const express = require('express');\nconst app = express();\napp.listen(3000, () => console.log('Server running'));",
                "function binarySearch(arr, target) {\n    let left = 0, right = arr.length - 1;\n    while(left <= right) {\n        let mid = Math.floor((left + right) / 2);\n        if(arr[mid] === target) return mid;\n    }\n}",
                "async function fetchData(url) {\n    try {\n        const response = await fetch(url);\n        return await response.json();\n    } catch(err) { console.error(err); }\n}",
                "document.addEventListener('keydown', (e) => {\n    if(e.key === 'Tab') e.preventDefault();\n});"
            ],
            english: [
                "apple banana cherry dog elephant forest guitar harbor island jungle",
                "kangaroo lemon mountain nebula ocean planet quartz river telescope umbrella",
                "volcano window xylophone yacht zebra anchor bridge crystal diamond engine",
                "feather galaxy horizon ignition journey kinetic lantern melody nucleus oxygen"
            ]
        };

        // State variables
        let testConfig = { mode: 'time', val: 30, category: 'quotes' };
        let gameState = 'idle'; // idle, running, finished
        let currentText = '';
        let charIndex = 0;
        let errorsCount = 0;
        let correctCharsCount = 0;
        let totalTypedChars = 0;
        let startTime = null;
        let timerInterval = null;
        let timeLeft = 30;
        let wpmHistory = [];

        // DOM elements
        const textDisplay = document.getElementById('text-display');
        const wordInput = document.getElementById('word-input');
        const focusOverlay = document.getElementById('focus-overlay');
        const timerDisplay = document.getElementById('timer-display');
        const wpmDisplay = document.getElementById('wpm-display');
        const accDisplay = document.getElementById('acc-display');
        const errDisplay = document.getElementById('err-display');
        const typingCard = document.getElementById('typing-card');
        const resultsContainer = document.getElementById('results-container');
        const hudStats = document.getElementById('hud-stats');
        const speedChart = document.getElementById('speed-chart');

        // Setup options & themes
        document.querySelectorAll('.btn-option[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-option[data-mode]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                testConfig.mode = e.target.getAttribute('data-mode');
                testConfig.val = parseInt(e.target.getAttribute('data-val'));
                resetTest();
            });
        });

        document.getElementById('category-select').addEventListener('change', (e) => {
            testConfig.category = e.target.value;
            resetTest();
        });

        document.getElementById('theme-select').addEventListener('change', (e) => {
            document.body.setAttribute('data-theme', e.target.value);
        });

        // Focus Handlers
        typingCard.addEventListener('click', () => {
            wordInput.focus();
            focusOverlay.classList.add('hidden');
        });

        wordInput.addEventListener('blur', () => {
            if(gameState === 'running') focusOverlay.classList.remove('hidden');
        });

        // Text generation
        function loadNewText() {
            const pool = datasets[testConfig.category];
            currentText = pool[Math.floor(Math.random() * pool.length)];
            textDisplay.innerHTML = currentText.split('').map(char => `<span>${char}</span>`).join('');
            highlightCurrentChar();
        }

        function highlightCurrentChar() {
            const spans = textDisplay.querySelectorAll('span');
            spans.forEach((span, idx) => {
                span.className = '';
                if (idx < charIndex) {
                    span.classList.add(span.dataset.correct === 'true' ? 'correct' : 'incorrect');
                } else if (idx === charIndex) {
                    span.classList.add('current');
                }
            });
        }

        // Test Lifecycle
        function startTest() {
            if (gameState === 'running') return;
            gameState = 'running';
            startTime = new Date().getTime();
            timeLeft = testConfig.mode === 'time' ? testConfig.val : 0;
            
            wpmHistory = [];

            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((new Date().getTime() - startTime) / 1000);
                
                if (testConfig.mode === 'time') {
                    timeLeft = testConfig.val - elapsedSeconds;
                    timerDisplay.textContent = Math.max(0, timeLeft);
                    if (timeLeft <= 0) finishTest();
                } else {
                    timerDisplay.textContent = elapsedSeconds;
                }

                // Track WPM live metrics
                updateLiveStats(elapsedSeconds);

                // Sample history every 2 seconds for chart
                if(elapsedSeconds > 0 && elapsedSeconds % 2 === 0) {
                    wpmHistory.push(parseInt(wpmDisplay.textContent));
                }
            }, 1000);
        }

        function updateLiveStats(elapsedSeconds) {
            const minutes = elapsedSeconds / 60;
            if (minutes > 0) {
                const wordsTyped = (correctCharsCount / 5);
                const currentWpm = Math.round(wordsTyped / minutes);
                wpmDisplay.textContent = isNaN(currentWpm) ? 0 : currentWpm;
            }
            const totalAttempts = correctCharsCount + errorsCount;
            const accuracy = totalAttempts > 0 ? Math.round((correctCharsCount / totalAttempts) * 100) : 100;
            accDisplay.textContent = accuracy + '%';
            errDisplay.textContent = errorsCount;
        }

        // Input Engine listener
        wordInput.addEventListener('input', (e) => {
            if (gameState === 'idle') startTest();
            if (gameState !== 'running') return;

            const inputVal = e.target.value;
            const typedChar = inputVal.slice(-1);
            
            // Handle backspace simulation natively via index tracking or direct input comparison
            // Simplest robust method for character-by-character tracking:
            const targetChar = currentText[charIndex];

            if (!typedChar) return; // safety

            totalTypedChars++;
            const spans = textDisplay.querySelectorAll('span');

            if (typedChar === targetChar) {
                correctCharsCount++;
                spans[charIndex].dataset.correct = 'true';
                spans[charIndex].classList.add('correct');
            } else {
                errorsCount++;
                spans[charIndex].dataset.correct = 'false';
                spans[charIndex].classList.add('incorrect');
            }

            charIndex++;
            e.target.value = ''; // clear input buffer immediately

            highlightCurrentChar();

            // Auto scroll container if text overflows down
            if (charIndex >= currentText.length) {
                if (testConfig.mode === 'words') {
                    finishTest();
                } else {
                    loadNewText();
                    charIndex = 0;
                }
            }
        });

        // Handle backspace smoothly if needed
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                resetTest();
            }
            if (e.key === 'Backspace' && gameState === 'running' && charIndex > 0) {
                charIndex--;
                const spans = textDisplay.querySelectorAll('span');
                spans[charIndex].className = '';
                spans[charIndex].dataset.correct = '';
                highlightCurrentChar();
            }
        });

        function finishTest() {
            gameState = 'finished';
            clearInterval(timerInterval);

            typingCard.style.display = 'none';
            hudStats.style.display = 'none';
            resultsContainer.classList.add('active');

            const totalTimeMinutes = Math.max(1, ((new Date().getTime() - startTime) / 1000)) / 60;
            const finalWpm = Math.round((correctCharsCount / 5) / totalTimeMinutes);
            const totalAttempts = correctCharsCount + errorsCount;
            const finalAcc = totalAttempts > 0 ? Math.round((correctCharsCount / totalAttempts) * 100) : 100;

            document.getElementById('res-wpm').textContent = finalWpm;
            document.getElementById('res-acc').textContent = finalAcc + '%';
            document.getElementById('res-chars').textContent = `${correctCharsCount} / ${errorsCount}`;

            // Render live chart
            speedChart.innerHTML = '';
            if(wpmHistory.length === 0) wpmHistory = [finalWpm];
            const maxWpm = Math.max(...wpmHistory, 10);
            wpmHistory.forEach(val => {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.style.height = `${(val / maxWpm) * 100}%`;
                speedChart.appendChild(bar);
            });
        }

        function resetTest() {
            clearInterval(timerInterval);
            gameState = 'idle';
            charIndex = 0;
            errorsCount = 0;
            correctCharsCount = 0;
            totalTypedChars = 0;
            startTime = null;

            typingCard.style.display = 'block';
            hudStats.style.display = 'grid';
            resultsContainer.classList.remove('active');
            focusOverlay.classList.remove('hidden');

            timerDisplay.textContent = testConfig.mode === 'time' ? testConfig.val : '0';
            wpmDisplay.textContent = '0';
            accDisplay.textContent = '100%';
            errDisplay.textContent = '0';

            loadNewText();
            wordInput.value = '';
        }

        document.getElementById('restart-btn').addEventListener('click', resetTest);
        document.getElementById('res-restart-btn').addEventListener('click', resetTest);

        // Initial setup execution
        resetTest();
    </script>
</body>
</html>
