<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Klondike Solitaire</title>
    <style>
        :root {
            --felt-green: #076324;
            --felt-dark: #044217;
            --card-width: 90px;
            --card-height: 130px;
            --card-radius: 8px;
            --shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--felt-green);
            background-image: radial-gradient(circle, var(--felt-green) 0%, var(--felt-dark) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            gap: 25px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: scale(0.96);
        }

        main {
            flex: 1;
            padding: 20px 30px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stock-waste-container {
            display: flex;
            gap: 20px;
        }

        .foundations-container {
            display: flex;
            gap: 15px;
        }

        .tableau-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            min-height: 350px;
        }

        .slot {
            width: var(--card-width);
            height: var(--card-height);
            border: 2px dashed rgba(255, 255, 255, 0.25);
            border-radius: var(--card-radius);
            position: relative;
        }

        .tableau-pile {
            width: var(--card-width);
            position: relative;
            cursor: pointer;
        }

        .card {
            width: var(--card-width);
            height: var(--card-height);
            background: white;
            border-radius: var(--card-radius);
            box-shadow: var(--shadow);
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: grab;
            transition: box-shadow 0.2s;
        }

        .card:active {
            cursor: grabbing;
        }

        .card.dragging {
            opacity: 0.8;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .card.red {
            color: #d32f2f;
        }

        .card.black {
            color: #212121;
        }

        .card.face-down {
            background: linear-gradient(135deg, #b71c1c 0%, #c62828 100%);
            border: 2px solid white;
            cursor: pointer;
        }

        .card.face-down::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                rgba(255,255,255,0.1) 5px,
                rgba(255,255,255,0.1) 10px
            );
        }

        .card-top {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .card-center {
            align-self: center;
            font-size: 2.2rem;
        }

        .card-bottom {
            display: flex;
            flex-direction: column;
            line-height: 1;
            transform: rotate(180deg);
        }

        /* Win Overlay */
        #win-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #1e4620;
            border: 3px solid #gold;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .modal-content p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Solitaire</h1>
        <div class="stats">
            <div>Time: <span id="timer">00:00</span></div>
            <div>Score: <span id="score">0</span></div>
            <div>Moves: <span id="moves">0</span></div>
        </div>
        <div class="controls">
            <button id="restart-btn">New Game</button>
            <button id="hint-btn">Hint</button>
        </div>
    </header>

    <main>
        <div class="top-row">
            <div class="stock-waste-container">
                <div id="stock" class="slot" title="Click to draw"></div>
                <div id="waste" class="slot"></div>
            </div>
            <div class="foundations-container">
                <div id="foundation-0" class="slot foundation" data-suit="hearts"></div>
                <div id="foundation-1" class="slot foundation" data-suit="diamonds"></div>
                <div id="foundation-2" class="slot foundation" data-suit="clubs"></div>
                <div id="foundation-3" class="slot foundation" data-suit="spades"></div>
            </div>
        </div>

        <div class="tableau-container">
            <div id="tableau-0" class="tableau-pile slot"></div>
            <div id="tableau-1" class="tableau-pile slot"></div>
            <div id="tableau-2" class="tableau-pile slot"></div>
            <div id="tableau-3" class="tableau-pile slot"></div>
            <div id="tableau-4" class="tableau-pile slot"></div>
            <div id="tableau-5" class="tableau-pile slot"></div>
            <div id="tableau-6" class="tableau-pile slot"></div>
        </div>
    </main>

    <div id="win-modal">
        <div class="modal-content">
            <h2>You Win!</h2>
            <p id="win-stats">Completed in 03:45 with a score of 450.</p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script>
        const SUITS = ['hearts', 'diamonds', 'clubs', 'spades'];
        const VALUES = [
            {v: 1, name: 'A'}, {v: 2, name: '2'}, {v: 3, name: '3'}, {v: 4, name: '4'},
            {v: 5, name: '5'}, {v: 6, name: '6'}, {v: 7, name: '7'}, {v: 8, name: '8'},
            {v: 9, name: '9'}, {v: 10, name: '10'}, {v: 11, name: 'J'}, {v: 12, name: 'Q'}, {v: 13, name: 'K'}
        ];

        let deck = [];
        let stock = [];
        let waste = [];
        let foundations = [[], [], [], []];
        let tableau = [[], [], [], [], [], [], []];

        let score = 0;
        let moves = 0;
        let secondsElapsed = 0;
        let timerInterval = null;
        let gameActive = false;

        const suitSymbols = { hearts: '♥', diamonds: '♦', clubs: '♣', spades: '♠' };
        const suitColors = { hearts: 'red', diamonds: 'red', clubs: 'black', spades: 'black' };

        // DOM Elements
        const stockEl = document.getElementById('stock');
        const wasteEl = document.getElementById('waste');
        const foundationEls = [0, 1, 2, 3].map(i => document.getElementById(`foundation-${i}`));
        const tableauEls = [0, 1, 2, 3, 4, 5, 6].map(i => document.getElementById(`tableau-${i}`));
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const movesEl = document.getElementById('moves');
        const winModal = document.getElementById('win-modal');
        const winStats = document.getElementById('win-stats');

        function initGame() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            score = 0;
            moves = 0;
            gameActive = false;
            updateStats();
            winModal.style.display = 'none';

            createDeck();
            shuffleDeck();
            dealGame();
            render();
        }

        function createDeck() {
            deck = [];
            let id = 0;
            for (let suit of SUITS) {
                for (let valObj of VALUES) {
                    deck.push({
                        id: `card-${id++}`,
                        suit: suit,
                        value: valObj.v,
                        name: valObj.name,
                        color: suitColors[suit],
                        faceUp: false
                    });
                }
            }
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function dealGame() {
            stock = [...deck];
            waste = [];
            foundations = [[], [], [], []];
            tableau = [[], [], [], [], [], [], []];

            for (let i = 0; i < 7; i++) {
                for (let j = i; j < 7; j++) {
                    let card = stock.pop();
                    if (i === j) {
                        card.faceUp = true;
                    } else {
                        card.faceUp = false;
                    }
                    tableau[j].push(card);
                }
            }
        }

        function startTimer() {
            if (!gameActive) {
                gameActive = true;
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    let mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                    let secs = (secondsElapsed % 60).toString().padStart(2, '0');
                    timerEl.textContent = `${mins}:${secs}`;
                }, 1000);
            }
        }

        function updateStats() {
            scoreEl.textContent = score;
            movesEl.textContent = moves;
        }

        // Render functions
        function render() {
            renderStock();
            renderWaste();
            renderFoundations();
            renderTableau();
        }

        function createCardElement(card) {
            const el = document.createElement('div');
            el.className = `card ${card.color} ${card.faceUp ? '' : 'face-down'}`;
            el.dataset.id = card.id;

            if (card.faceUp) {
                el.innerHTML = `
                    <div class="card-top">
                        <span>${card.name}</span>
                        <span>${suitSymbols[card.suit]}</span>
                    </div>
                    <div class="card-center">${suitSymbols[card.suit]}</div>
                    <div class="card-bottom">
                        <span>${card.name}</span>
                        <span>${suitSymbols[card.suit]}</span>
                    </div>
                `;
            }
            return el;
        }

        function renderStock() {
            stockEl.innerHTML = '';
            if (stock.length > 0) {
                const cardEl = createCardElement(stock[stock.length - 1]);
                stockEl.appendChild(cardEl);
            }
        }

        function renderWaste() {
            wasteEl.innerHTML = '';
            if (waste.length > 0) {
                const cardEl = createCardElement(waste[waste.length - 1]);
                wasteEl.appendChild(cardEl);
            }
        }

        function renderFoundations() {
            foundationEls.forEach((el, index) => {
                el.innerHTML = '';
                const pile = foundations[index];
                if (pile.length > 0) {
                    const cardEl = createCardElement(pile[pile.length - 1]);
                    el.appendChild(cardEl);
                }
            });
        }

        function renderTableau() {
            tableauEls.forEach((el, index) => {
                el.innerHTML = '';
                const pile = tableau[index];
                pile.forEach((card, cardIndex) => {
                    const cardEl = createCardElement(card);
                    cardEl.style.top = `${cardIndex * 25}px`;
                    el.appendChild(cardEl);
                });
            });
        }

        // Interaction Handling
        stockEl.addEventListener('click', () => {
            startTimer();
            if (stock.length === 0) {
                if (waste.length === 0) return;
                stock = waste.reverse().map(c => { c.faceUp = false; return c; });
                waste = [];
                score = Math.max(0, score - 100);
            } else {
                let card = stock.pop();
                card.faceUp = true;
                waste.push(card);
            }
            moves++;
            updateStats();
            render();
            checkWin();
        });

        // Drag & Drop or Click Logic simplified via Global Listeners
        let draggedData = null; // { card, source, sourceIndex }

        document.addEventListener('mousedown', (e) => {
            const cardEl = e.target.closest('.card');
            if (!cardEl) return;

            // Find where this card belongs
            let cardId = cardEl.dataset.id;
            let location = findCardLocation(cardId);
            if (!location) return;

            // If it's face down, check if it's the top of a tableau pile to flip it
            if (!location.card.faceUp) {
                if (location.type === 'tableau' && location.cardIndex === tableau[location.pileIndex].length - 1) {
                    startTimer();
                    location.card.faceUp = true;
                    score += 5;
                    moves++;
                    updateStats();
                    render();
                }
                return;
            }

            // Prevent dragging from stock directly via click-only rules usually, but waste & tableau are draggable
            if (location.type === 'stock') return;

            // Prepare drag payload (can be multiple cards if tableau)
            draggedData = location;
            
            // Add dragging class
            if (location.type === 'tableau') {
                for (let i = location.cardIndex; i < tableau[location.pileIndex].length; i++) {
                    let id = tableau[location.pileIndex][i].id;
                    let el = document.querySelector(`[data-id="${id}"]`);
                    if (el) el.classList.add('dragging');
                }
            } else {
                cardEl.classList.add('dragging');
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!draggedData) return;

            // Find drop target
            const targetEl = e.target.elementFromPoint ? null : document.elementFromPoint(e.clientX, e.clientY);
            // Let's use direct element lookup or event target parsing
            let dropZone = e.target.closest('.slot, .tableau-pile, .foundation');
            
            if (dropZone) {
                handleDrop(dropZone, draggedData);
            }

            // Cleanup dragging visual states
            document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
            draggedData = null;
            render();
            checkWin();
        });

        function findCardLocation(cardId) {
            // Check waste
            if (waste.length > 0 && waste[waste.length - 1].id === cardId) {
                return { type: 'waste', card: waste[waste.length - 1] };
            }
            // Check foundations
            for (let i = 0; i < 4; i++) {
                let pile = foundations[i];
                if (pile.length > 0 && pile[pile.length - 1].id === cardId) {
                    return { type: 'foundation', pileIndex: i, card: pile[pile.length - 1] };
                }
            }
            // Check tableau
            for (let i = 0; i < 7; i++) {
                let pile = tableau[i];
                for (let j = 0; j < pile.length; j++) {
                    if (pile[j].id === cardId) {
                        return { type: 'tableau', pileIndex: i, cardIndex: j, card: pile[j] };
                    }
                }
            }
            return null;
        }

        function handleDrop(zone, source) {
            startTimer();
            let targetType = null;
            let targetPileIndex = null;

            if (zone.classList.contains('foundation')) {
                targetType = 'foundation';
                targetPileIndex = foundationEls.indexOf(zone);
            } else if (zone.classList.contains('tableau-pile') || zone.classList.contains('slot') && zone.id.startsWith('tableau')) {
                targetType = 'tableau';
                targetPileIndex = tableauEls.indexOf(zone);
                if (targetPileIndex === -1) {
                    // Maybe dropped on a card inside tableau
                    let tabPile = zone.closest('.tableau-pile');
                    if (tabPile) targetPileIndex = tableauEls.indexOf(tabPile);
                }
            }

            if (targetType === 'foundation' && targetPileIndex !== -1) {
                // Only single cards can move to foundation
                let movingCard = getMovingCards(source);
                if (movingCard.length !== 1) return;
                card = movingCard[0];

                let targetPile = foundations[targetPileIndex];
                let isValid = false;

                if (targetPile.length === 0) {
                    if (card.value === 1) isValid = true;
                } else {
                    let topCard = targetPile[targetPile.length - 1];
                    if (card.suit === topCard.suit && card.value === topCard.value + 1) isValid = true;
                }

                if (isValid) {
                    removeSourceCards(source);
                    targetPile.push(card);
                    score += 10;
                    moves++;
                    updateStats();
                }
            } 
            else if (targetType === 'tableau' && targetPileIndex !== -1) {
                let movingCards = getMovingCards(source);
                if (movingCards.length === 0) return;

                let targetPile = tableau[targetPileIndex];
                let isValid = false;

                if (targetPile.length === 0) {
                    if (movingCards[0].value === 13) isValid = true; // King on empty
                } else {
                    let topCard = targetPile[targetPile.length - 1];
                    if (topCard.faceUp && movingCards[0].color !== topCard.color && movingCards[0].value === topCard.value - 1) {
                        isValid = true;
                    }
                }

                if (isValid) {
                    removeSourceCards(source);
                    tableau[targetPileIndex].push(...movingCards);
                    score += source.type === 'waste' ? 10 : 5;
                    moves++;
                    updateStats();
                }
            }
        }

        function getMovingCards(source) {
            if (source.type === 'waste') {
                return [waste[waste.length - 1]];
            } else if (source.type === 'tableau') {
                return tableau[source.pileIndex].slice(source.cardIndex);
            }
            return [];
        }

        function removeSourceCards(source) {
            if (source.type === 'waste') {
                waste.pop();
            } else if (source.type === 'tableau') {
                tableau[source.pileIndex].splice(source.cardIndex);
            }
        }

        // Double-click auto-move to foundation feature
        document.addEventListener('dblclick', (e) => {
            const cardEl = e.target.closest('.card');
            if (!cardEl) return;
            let location = findCardLocation(cardEl.dataset.id);
            if (!location || !location.card.faceUp) return;

            // Only move if it's the top card of waste or tableau
            let isTop = false;
            if (location.type === 'waste') isTop = true;
            if (location.type === 'tableau' && location.cardIndex === tableau[location.pileIndex].length - 1) isTop = true;

            if (!isTop) return;

            // Find matching foundation
            for (let i = 0; i < 4; i++) {
                let pile = foundations[i];
                let card = location.card;
                let isValid = false;
                if (pile.length === 0 && card.value === 1) isValid = true;
                if (pile.length > 0) {
                    let topCard = pile[pile.length - 1];
                    if (card.suit === topCard.suit && card.value === topCard.value + 1) isValid = true;
                }

                if (isValid) {
                    startTimer();
                    removeSourceCards(location);
                    pile.push(card);
                    score += 15;
                    moves++;
                    updateStats();
                    render();
                    checkWin();
                    break;
                }
            }
        });

        function checkWin() {
            let totalFoundationCards = foundations.reduce((sum, pile) => sum + pile.length, 0);
            if (totalFoundationCards === 52) {
                clearInterval(timerInterval);
                winStats.textContent = `Completed in ${timerEl.textContent} with a score of ${score} in ${moves} moves!`;
                winModal.style.display = 'flex';
            }
        }

        // Hint system
        document.getElementById('hint-btn').addEventListener('click', () => {
            // Simple hint search: check waste or tableau top cards against foundations or other tableau piles
            let findMove = () => {
                // Check waste to foundation
                if (waste.length > 0) {
                    let card = waste[waste.length - 1];
                    for (let i = 0; i < 4; i++) {
                        let pile = foundations[i];
                        if ((pile.length === 0 && card.value === 1) || 
                            (pile.length > 0 && pile[pile.length - 1].suit === card.suit && pile[pile.length - 1].value === card.value - 1)) {
                            return `Move ${card.name}${suitSymbols[card.suit]} from Waste to Foundation.`;
                        }
                    }
                }
                // Check tableau to foundation
                for (let t = 0; t < 7; t++) {
                    let pile = tableau[t];
                    if (pile.length === 0) continue;
                    let card = pile[pile.length - 1];
                    if (!card.faceUp) continue;
                    for (let i = 0; i < 4; i++) {
                        let fPile = foundations[i];
                        if ((fPile.length === 0 && card.value === 1) || 
                            (fPile.length > 0 && fPile[fPile.length - 1].suit === card.suit && fPile[fPile.length - 1].value === card.value - 1)) {
                            return `Move ${card.name}${suitSymbols[card.suit]} from Tableau ${t+1} to Foundation.`;
                        }
                    }
                }
                return "No obvious moves found. Keep drawing or shifting cards!";
            };
            alert(findMove());
        });

        document.getElementById('restart-btn').addEventListener('click', initGame);
        document.getElementById('play-again-btn').addEventListener('click', initGame);

        // Run on load
        initGame();
    </script>
</body>
</html>
