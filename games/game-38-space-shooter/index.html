<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Raider - Arcade Space Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 480px;
            height: 640px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border: 2px solid #1a1a3a;
            background: #000;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #101026 0%, #020208 100%);
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px #00f3ff;
            letter-spacing: 1px;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 36px;
            margin: 0 0 10px 0;
            color: #00f3ff;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }
        p {
            color: #a0a0c0;
            margin: 5px 0 20px 0;
            font-size: 14px;
            text-align: center;
            max-width: 80%;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .controls-hint {
            margin-top: 30px;
            font-size: 12px;
            color: #606080;
            text-align: center;
            line-height: 1.5;
        }
        .key {
            display: inline-block;
            background: #1a1a3a;
            border: 1px solid #303060;
            padding: 2px 6px;
            border-radius: 3px;
            color: #00f3ff;
            font-family: monospace;
        }
        #ability-bar-container {
            width: 100px;
            height: 8px;
            background: #1a1a3a;
            border: 1px solid #00f3ff;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        #ability-bar {
            width: 100%;
            height: 100%;
            background: #00f3ff;
            transition: width 0.1s linear;
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    
    <div class="ui-layer">
        <div class="hud-top">
            <div id="score-display">SCORE: 000000</div>
            <div id="wave-display">WAVE 1</div>
        </div>
        <div class="hud-bottom">
            <div>
                <div style="font-size: 12px; color: #a0a0c0; text-transform: uppercase;">Shields</div>
                <div id="health-display" style="color: #ff3366; font-size: 16px; font-weight: bold; text-shadow: 0 0 5px #ff3366;">♥♥♥</div>
            </div>
            <div>
                <div style="font-size: 12px; color: #a0a0c0; text-transform: uppercase;">EMP Blast</div>
                <div id="ability-bar-container">
                    <div id="ability-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Cosmic Raider</h1>
        <p>Defend the galaxy against incoming alien armadas. Collect power-ups, unleash EMP blasts, and survive.</p>
        <button class="btn" id="start-btn">Start Mission</button>
        <div class="controls-hint">
            Move: <span class="key">WASD</span> or <span class="key">Arrows</span><br>
            Shoot: <span class="key">Spacebar</span> (Auto-fire active)<br>
            EMP Blast: <span class="key">Shift</span> or <span class="key">X</span>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
        <h1>Mission Failed</h1>
        <p id="final-score">Final Score: 0</p>
        <button class="btn" id="restart-btn">Try Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI Elements
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('gameover-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const scoreDisplay = document.getElementById('score-display');
const waveDisplay = document.getElementById('wave-display');
const healthDisplay = document.getElementById('health-display');
const finalScoreDisplay = document.getElementById('final-score');
const abilityBar = document.getElementById('ability-bar');

// Game States
let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let wave = 1;
let gameTime = 0;

// Input Management
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX') && gameState === 'PLAYING') {
        triggerEMP();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Game Entities
let player;
let enemies = [];
let bullets = [];
let enemyBullets = [];
let particles = [];
let powerups = [];
let stars = [];

// Initialize Starfield
for (let i = 0; i < 100; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 2 + 0.5
    });
}

class Player {
    constructor() {
        this.width = 36;
        this.height = 36;
        this.x = canvas.width / 2 - this.width / 2;
        this.y = canvas.height - 80;
        this.speed = 5;
        this.health = 3;
        this.maxHealth = 3;
        this.weaponLevel = 1;
        this.empCharge = 100;
        this.empMax = 100;
        this.invulnerableTimer = 0;
        this.shootCooldown = 0;
    }

    update() {
        // Movement
        if ((keys['ArrowLeft'] || keys['KeyA']) && this.x > 0) this.x -= this.speed;
        if ((keys['ArrowRight'] || keys['KeyD']) && this.x < canvas.width - this.width) this.x += this.speed;
        if ((keys['ArrowUp'] || keys['KeyW']) && this.y > 100) this.y -= this.speed;
        if ((keys['ArrowDown'] || keys['KeyS']) && this.y < canvas.height - this.height - 20) this.y += this.speed;

        // Auto Shooting
        if (this.shootCooldown > 0) {
            this.shootCooldown--;
        } else {
            this.shoot();
            this.shootCooldown = 12; // Fire rate
        }

        // EMP Regeneration
        if (this.empCharge < this.empMax) {
            this.empCharge += 0.15;
            if (this.empCharge > this.empMax) this.empCharge = this.empMax;
        }

        // Invulnerability countdown
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;

        // Update UI elements
        abilityBar.style.width = `${(this.empCharge / this.empMax) * 100}%`;
    }

    shoot() {
        if (this.weaponLevel === 1) {
            bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y, 0, -10, '#00f3ff'));
        } else if (this.weaponLevel === 2) {
            bullets.push(new Bullet(this.x + 5, this.y, 0, -10, '#00f3ff'));
            bullets.push(new Bullet(this.x + this.width - 9, this.y, 0, -10, '#00f3ff'));
        } else {
            bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y, 0, -12, '#00ffcc'));
            bullets.push(new Bullet(this.x + 2, this.y + 5, -1, -10, '#00f3ff'));
            bullets.push(new Bullet(this.x + this.width - 6, this.y + 5, 1, -10, '#00f3ff'));
        }
    }

    draw() {
        if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) return;

        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

        // Engine glow
        ctx.fillStyle = '#00f3ff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00f3ff';
        ctx.fillRect(-4, this.height / 2, 8, Math.random() * 8 + 6);

        // Ship body
        ctx.fillStyle = '#1e1e3f';
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(0, -this.height / 2);
        ctx.lineTo(this.width / 2, this.height / 2);
        ctx.lineTo(this.width / 4, this.height / 3);
        ctx.lineTo(-this.width / 4, this.height / 3);
        ctx.lineTo(-this.width / 2, this.height / 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }
}

class Bullet {
    constructor(x, y, vx, vy, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.width = 4;
        this.height = 12;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
    }

    draw() {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
        ctx.restore();
    }
}

class Enemy {
    constructor(type, x, y) {
        this.type = type; // 'drone', 'scout', 'tank'
        this.x = x;
        this.y = y;
        this.width = type === 'tank' ? 44 : (type === 'scout' ? 28 : 34);
        this.height = type === 'tank' ? 44 : (type === 'scout' ? 28 : 34);
        
        if (type === 'drone') {
            this.health = 2;
            this.maxHealth = 2;
            this.speed = 2;
            this.scoreVal = 100;
        } else if (type === 'scout') {
            this.health = 1;
            this.maxHealth = 1;
            this.speed = 3.5;
            this.scoreVal = 150;
            this.shootTimer = Math.random() * 60;
        } else if (type === 'tank') {
            this.health = 6;
            this.maxHealth = 6;
            this.speed = 1;
            this.scoreVal = 300;
            this.shootTimer = 0;
        }
        this.oscillation = Math.random() * 100;
    }

    update() {
        this.oscillation += 0.05;
        if (this.type === 'drone') {
            this.y += this.speed;
            this.x += Math.sin(this.oscillation) * 1.5;
        } else if (this.type === 'scout') {
            this.y += this.speed;
            this.shootTimer++;
            if (this.shootTimer > 90) {
                this.shootTimer = 0;
                enemyBullets.push(new Bullet(this.x + this.width / 2 - 2, this.y + this.height, 0, 4, '#ff3366'));
            }
        } else if (this.type === 'tank') {
            this.y += this.speed;
            this.shootTimer++;
            if (this.shootTimer > 70) {
                this.shootTimer = 0;
                enemyBullets.push(new Bullet(this.x + 5, this.y + this.height, -0.5, 3.5, '#ff3366'));
                enemyBullets.push(new Bullet(this.x + this.width - 9, this.y + this.height, 0.5, 3.5, '#ff3366'));
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

        ctx.fillStyle = '#2a1020';
        ctx.strokeStyle = '#ff3366';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ff3366';

        ctx.beginPath();
        if (this.type === 'drone') {
            ctx.moveTo(0, this.height / 2);
            ctx.lineTo(-this.width / 2, -this.height / 2);
            ctx.lineTo(0, -this.height / 4);
            ctx.lineTo(this.width / 2, -this.height / 2);
        } else if (this.type === 'scout') {
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, this.height / 2);
            ctx.lineTo(0, this.height / 4);
            ctx.lineTo(-this.width / 2, this.height / 2);
        } else if (this.type === 'tank') {
            ctx.rect(-this.width / 2, -this.height / 2, this.width, this.height);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }
}

class PowerUp {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.width = 24;
        this.height = 24;
        this.type = type; // 'weapon', 'health', 'emp'
        this.speed = 1.5;
    }

    update() {
        this.y += this.speed;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        ctx.fillStyle = this.type === 'weapon' ? '#00ffcc' : (this.type === 'health' ? '#ff3366' : '#ffcc00');
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type === 'weapon' ? 'W' : (this.type === 'health' ? 'H' : 'E'), 0, 0);
        
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color, speedMultiplier = 1) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6 * speedMultiplier;
        this.vy = (Math.random() - 0.5) * 6 * speedMultiplier;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = color;
        this.size = Math.random() * 3 + 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 5;
        ctx.shadowColor = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

function triggerEMP() {
    if (player.empCharge >= 100) {
        player.empCharge = 0;
        // Destroy all enemies & bullets
        enemies.forEach(e => {
            createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#00f3ff', 15);
            score += e.scoreVal;
        });
        enemies = [];
        enemyBullets = [];
        
        // Flash Effect
        ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function createExplosion(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function spawnWaveEnemies() {
    let count = 4 + wave * 2;
    for (let i = 0; i < count; i++) {
        let type = 'drone';
        let rand = Math.random();
        if (wave >= 2 && rand > 0.5) type = 'scout';
        if (wave >= 3 && rand > 0.8) type = 'tank';
        
        let x = Math.random() * (canvas.width - 50) + 25;
        let y = -100 - (i * 60);
        enemies.push(new Enemy(type, x, y));
    }
}

function checkCollisions() {
    // Player bullets vs Enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                e.health--;
                createExplosion(b.x, b.y, '#00f3ff', 3);
                bullets.splice(i, 1);

                if (e.health <= 0) {
                    createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ff3366', 12);
                    score += e.scoreVal;

                    // Drop PowerUp chance
                    let dropChance = Math.random();
                    if (dropChance < 0.15) {
                        let pType = Math.random() < 0.4 ? 'weapon' : (Math.random() < 0.7 ? 'health' : 'emp');
                        powerups.push(new PowerUp(e.x, e.y, pType));
                    }

                    enemies.splice(j, 1);
                }
                break;
            }
        }
    }

    // Enemy bullets vs Player
    if (player.invulnerableTimer === 0) {
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let eb = enemyBullets[i];
            if (eb.x < player.x + player.width && eb.x + eb.width > player.x && eb.y < player.y + player.height && eb.y + eb.height > player.y) {
                enemyBullets.splice(i, 1);
                damagePlayer();
                break;
            }
        }

        // Enemies vs Player direct touch
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (e.x < player.x + player.width && e.x + e.width > player.x && e.y < player.y + player.height && e.y + e.height > player.y) {
                enemies.splice(j, 1);
                createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ff3366', 15);
                damagePlayer();
                break;
            }
        }
    }

    // Powerups vs Player
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.update();
        if (p.x < player.x + player.width && p.x + p.width > player.x && p.y < player.y + player.height && p.y + p.height > player.y) {
            if (p.type === 'weapon') {
                if (player.weaponLevel < 3) player.weaponLevel++;
            } else if (p.type === 'health') {
                if (player.health < player.maxHealth) player.health++;
            } else if (p.type === 'emp') {
                player.empCharge = player.empMax;
            }
            powerups.splice(i, 1);
        }
    }
}

function damagePlayer() {
    player.health--;
    player.invulnerableTimer = 60; // 1 second invulnerability
    createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ff3366', 20);

    if (player.health <= 0) {
        gameState = 'GAMEOVER';
        finalScoreDisplay.innerText = `Final Score: ${score}`;
        gameOverScreen.classList.remove('hidden');
    }
}

function updateHUD() {
    scoreDisplay.innerText = `SCORE: ${String(score).padStart(6, '0')}`;
    waveDisplay.innerText = `WAVE ${wave}`;
    healthDisplay.innerText = '♥'.repeat(Math.max(0, player.health));
}

function resetGame() {
    score = 0;
    wave = 1;
    player = new Player();
    enemies = [];
    bullets = [];
    enemyBullets = [];
    particles = [];
    powerups = [];
    spawnWaveEnemies();
}

// Game Loop
function gameLoop() {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update & Draw Starfield
    ctx.fillStyle = '#ffffff';
    stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) star.y = 0;
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    if (gameState === 'PLAYING') {
        gameTime++;

        // Update entities
        player.update();

        bullets.forEach(b => b.update());
        bullets = bullets.filter(b => b.y > -20);

        enemyBullets.forEach(eb => eb.update());
        enemyBullets = enemyBullets.filter(eb => eb.y < canvas.height + 20);

        enemies.forEach(e => e.update());
        enemies = enemies.filter(e => e.y < canvas.height + 50);

        particles.forEach(p => p.update());
        particles = particles.filter(p => p.alpha > 0);

        powerups.forEach(p => p.update());
        powerups = powerups.filter(p => p.y < canvas.height + 20);

        // Check wave clearing
        if (enemies.length === 0) {
            wave++;
            spawnWaveEnemies();
        }

        checkCollisions();
        updateHUD();

        // Draw entities
        powerups.forEach(p => p.draw());
        bullets.forEach(b => b.draw());
        enemyBullets.forEach(eb => eb.draw());
        enemies.forEach(e => e.draw());
        player.draw();
        particles.forEach(p => p.draw());
    }

    requestAnimationFrame(gameLoop);
}

// Event Listeners for UI
startBtn.addEventListener('click', () => {
    startScreen.classList.add('hidden');
    resetGame();
    gameState = 'PLAYING';
});

restartBtn.addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    resetGame();
    gameState = 'PLAYING';
});

// Start loop heartbeat
gameLoop();
</script>

</body>
</html>
