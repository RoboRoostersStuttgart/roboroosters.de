<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Hex</title>
    <style>
        :root {
            --bg-color: #fbf7f0;
            --container-bg: #bbada0;
            --text-color: #776e65;
            --button-bg: #8f7a66;
            --button-hover: #9f8a76;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #4f4a45;
        }

        .scores-container {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background-color: var(--container-bg);
            padding: 8px 15px;
            border-radius: 4px;
            color: white;
            text-align: center;
            font-weight: bold;
            min-width: 60px;
        }

        .score-box .title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #eee4da;
        }

        .score-box .value {
            font-size: 1.25rem;
        }

        .controls-info {
            font-size: 0.85rem;
            margin-bottom: 15px;
            text-align: center;
            max-width: 450px;
            line-height: 1.4;
        }

        .game-container {
            position: relative;
            background-color: var(--container-bg);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        svg {
            display: block;
        }

        .btn {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--button-hover);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            color: #776e65;
        }

        .directional-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
            margin-top: 20px;
            justify-content: center;
        }

        .dir-btn {
            background-color: var(--button-bg);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .dir-btn:hover {
            background-color: var(--button-hover);
        }

        /* Tile color styles mapped via JS/SVG */
    </style>
</head>
<body>

    <div class="header">
        <h1>2048 Hex</h1>
        <div class="scores-container">
            <div class="score-box">
                <div class="title">Score</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="title">Best</div>
                <div class="value" id="best-score">0</div>
            </div>
        </div>
    </div>

    <div class="controls-info">
        Use <b>Q, W, E, A, S, D</b> keys or the directional buttons below to slide tiles across 6 axes. Merge matching numbers up to 2048!
    </div>

    <div class="game-container" id="game-container">
        <svg id="board-svg" width="360" height="320" viewBox="-180 -160 360 320"></svg>
        <div class="overlay" id="game-over-overlay">
            <h2 id="overlay-text">Game Over!</h2>
            <button class="btn" id="try-again-btn">Try Again</button>
        </div>
    </div>

    <button class="btn" id="restart-btn" style="margin-top: 15px;">New Game</button>

    <div class="directional-pad">
        <button class="dir-btn" style="grid-column: 1; grid-row: 1;" title="Top-Left (Q)" onclick="game.move(4)">↖</button>
        <button class="dir-btn" style="grid-column: 3; grid-row: 1;" title="Top-Right (W)" onclick="game.move(5)">↗</button>
        <button class="dir-btn" style="grid-column: 1; grid-row: 2;" title="Bottom-Left (A)" onclick="game.move(3)">↙</button>
        <button class="dir-btn" style="grid-column: 2; grid-row: 2;" title="Bottom (S)" onclick="game.move(2)">↓</button>
        <button class="dir-btn" style="grid-column: 3; grid-row: 2;" title="Bottom-Right (D)" onclick="game.move(1)">↘</button>
        <!-- Center helper or extra layout node -->
    </div>

<script>
    // Hex tile color mapping
    const tileColors = {
        2: { bg: '#eee4da', text: '#776e65' },
        4: { bg: '#ede0c8', text: '#776e65' },
        8: { bg: '#f2b179', text: '#f9f6f2' },
        16: { bg: '#f59563', text: '#f9f6f2' },
        32: { bg: '#f67c5f', text: '#f9f6f2' },
        64: { bg: '#f65e3b', text: '#f9f6f2' },
        128: { bg: '#edcf72', text: '#f9f6f2' },
        256: { bg: '#edcc61', text: '#f9f6f2' },
        512: { bg: '#edc850', text: '#f9f6f2' },
        1024: { bg: '#edc53f', text: '#f9f6f2' },
        2048: { bg: '#edc22e', text: '#f9f6f2' },
        4096: { bg: '#3c3a32', text: '#f9f6f2' },
        8192: { bg: '#3c3a32', text: '#f9f6f2' }
    };

    // Axial directions for hex grid (6 directions)
    // 0: Right (+1, 0), 1: Bottom-Right (+1, -1), 2: Bottom-Left (0, -1)
    // 3: Left (-1, 0), 4: Top-Left (-1, +1), 5: Top-Right (0, +1)
    const directions = [
        { q: 1, r: 0 },
        { q: 1, r: -1 },
        { q: 0, r: -1 },
        { q: -1, r: 0 },
        { q: -1, r: 1 },
        { q: 0, r: 1 }
    ];

    class HexGame {
        constructor(radius = 2) {
            this.radius = radius;
            this.score = 0;
            this.bestScore = localStorage.getItem('hex_2048_best') || 0;
            this.grid = new Map(); // key: "q,r", value: number
            this.hexSize = 32; // radius of hex in pixels
            this.initBoardCoordinates();
            this.setupListeners();
            this.reset();
        }

        initBoardCoordinates() {
            this.coords = [];
            for (let q = -this.radius; q <= this.radius; q++) {
                let r1 = Math.max(-this.radius, -q - this.radius);
                let r2 = Math.min(this.radius, -q + this.radius);
                for (let r = r1; r <= r2; r++) {
                    this.coords.push({ q, r });
                }
            }
        }

        getKey(q, r) {
            return `${q},${r}`;
        }

        reset() {
            this.score = 0;
            this.grid.clear();
            this.addNewTile();
            this.addNewTile();
            this.updateView();
        }

        addNewTile() {
            const emptyCells = this.coords.filter(c => !this.grid.has(this.getKey(c.q, c.r)));
            if (emptyCells.length === 0) return;
            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            this.grid.set(this.getKey(randomCell.q, randomCell.r), value);
        }

        pixelCoords(q, r) {
            const x = this.hexSize * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
            const y = this.hexSize * (3 / 2 * r);
            return { x, y };
        }

        drawHexPath(x, y, size) {
            let path = "";
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const hx = x + size * Math.cos(angle);
                const hy = y + size * Math.sin(angle);
                path += (i === 0 ? `M ${hx} ${hy}` : ` L ${hx} ${hy}`);
            }
            path += " Z";
            return path;
        }

        updateView() {
            document.getElementById('score').innerText = this.score;
            if (this.score > this.bestScore) {
                this.bestScore = this.score;
                localStorage.setItem('hex_2048_best', this.bestScore);
            }
            document.getElementById('best-score').innerText = this.bestScore;

            const svg = document.getElementById('board-svg');
            let svgContent = '';

            // Draw background empty grid cells
            this.coords.forEach(c => {
                const { x, y } = this.pixelCoords(c.q, c.r);
                const path = this.drawHexPath(x, y, this.hexSize - 2);
                svgContent += `<path d="${path}" fill="#cdc1b4" />`;
            });

            // Draw active tiles
            this.grid.forEach((val, key) => {
                const [q, r] = key.split(',').map(Number);
                const { x, y } = this.pixelCoords(q, r);
                const path = this.drawHexPath(x, y, this.hexSize - 4);
                const colorConfig = tileColors[val] || { bg: '#3c3a32', text: '#fff' };
                
                let fontSize = val > 1000 ? '12px' : val > 100 ? '15px' : '18px';

                svgContent += `
                    <g>
                        <path d="${path}" fill="${colorConfig.bg}" />
                        <text x="${x}" y="${y}" fill="${colorConfig.text}" font-size="${fontSize}" font-weight="bold" dominant-baseline="central" text-anchor="middle">${val}</text>
                    </g>
                `;
            });

            svg.innerHTML = svgContent;

            // Check game status
            if (this.isGameOver()) {
                document.getElementById('overlay-text').innerText = 'Game Over!';
                document.getElementById('game-over-overlay').classList.add('active');
            } else if (this.hasWon()) {
                document.getElementById('overlay-text').innerText = 'You Win!';
                document.getElementById('game-over-overlay').classList.add('active');
            } else {
                document.getElementById('game-over-overlay').classList.remove('active');
            }
        }

        move(dirIndex) {
            const dir = directions[dirIndex];
            let moved = false;

            // Sort coordinates to process correctly along the direction vector
            // Project coordinate onto movement axis to order them properly
            const sortedCoords = [...this.coords].sort((a, b) => {
                const projA = a.q * dir.q + a.r * dir.r;
                const projB = b.q * dir.q + b.r * dir.r;
                return projB - projA; // Process further along direction first
            });

            const mergedThisTurn = new Set();
            const newGrid = new Map(this.grid);

            sortedCoords.forEach(c => {
                const key = this.getKey(c.q, c.r);
                if (!newGrid.has(key)) return;

                let val = newGrid.get(key);
                newGrid.delete(key);

                let currQ = c.q;
                let currR = c.r;

                while (true) {
                    let nextQ = currQ + dir.q;
                    let nextR = currR + dir.r;
                    let nextKey = this.getKey(nextQ, nextR);

                    // Check if next coordinate is within board boundaries
                    let isValid = this.coords.some(item => item.q === nextQ && item.r === nextR);
                    if (!isValid) break;

                    if (newGrid.has(nextKey)) {
                        let neighborVal = newGrid.get(nextKey);
                        if (neighborVal === val && !mergedThisTurn.has(nextKey)) {
                            // Merge!
                            val *= 2;
                            this.score += val;
                            newGrid.set(nextKey, val);
                            mergedThisTurn.add(nextKey);
                            moved = true;
                        }
                        break;
                    } else {
                        currQ = nextQ;
                        currR = nextR;
                        moved = true;
                    }
                }

                if (!mergedThisTurn.has(this.getKey(currQ, currR))) {
                    newGrid.set(this.getKey(currQ, currR), val);
                }
            });

            if (moved) {
                this.grid = newGrid;
                this.addNewTile();
                this.updateView();
            }
        }

        isGameOver() {
            if (this.coords.some(c => !this.grid.has(this.getKey(c.q, c.r)))) return false;

            // Check if any adjacent matches exist
            for (let c of this.coords) {
                let val = this.grid.get(this.getKey(c.q, c.r));
                for (let dir of directions) {
                    let neighborKey = this.getKey(c.q + dir.q, c.r + dir.r);
                    if (this.grid.get(neighborKey) === val) return false;
                }
            }
            return true;
        }

        hasWon() {
            for (let val of this.grid.values()) {
                if (val >= 2048) return true;
            }
            return false;
        }

        setupListeners() {
            window.addEventListener('keydown', e => {
                switch (e.key.toLowerCase()) {
                    case 'q': this.move(4); break; // Top-Left
                    case 'w': this.move(5); break; // Top-Right
                    case 'e': this.move(0); break; // Right (or map accordingly)
                    case 'd': this.move(1); break; // Bottom-Right
                    case 's': this.move(2); break; // Bottom-Left / Down
                    case 'a': this.move(3); break; // Left
                }
            });

            document.getElementById('restart-btn').addEventListener('click', () => this.reset());
            document.getElementById('try-again-btn').addEventListener('click', () => this.reset());
        }
    }

    const game = new HexGame();
</script>

</body>
</html>
