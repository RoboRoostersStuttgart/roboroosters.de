<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-x: #38bdf8;
            --accent-o: #f43f5e;
            --border-color: #334155;
            --hover-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .config-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        select, button {
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        select:hover, button:hover {
            background: var(--hover-color);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .score-card {
            background: rgba(0, 0, 0, 0.15);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-card span:first-child {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .score-card span:last-child {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .status-bar {
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            aspect-ratio: 1;
        }

        .cell {
            background: var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            user-select: none;
        }

        .cell:hover:not(.filled) {
            background: var(--hover-color);
            transform: scale(0.98);
        }

        .cell.x {
            color: var(--accent-x);
        }

        .cell.o {
            color: var(--accent-o);
        }

        .cell.win {
            background: rgba(56, 189, 248, 0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-primary {
            background: #2563eb;
            flex: 1;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #475569;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tic-Tac-Toe</h1>
            <div class="subtitle">Complete Edition with AI & Stats</div>
        </header>

        <div class="config-panel">
            <div class="config-row">
                <label for="gameMode">Game Mode:</label>
                <select id="gameMode">
                    <option value="pvp">Player vs Player</option>
                    <option value="pve" selected>Player vs AI</option>
                </select>
            </div>
            <div class="config-row" id="difficultyRow">
                <label for="aiDifficulty">AI Difficulty:</label>
                <select id="aiDifficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard" selected>Unbeatable (Hard)</option>
                </select>
            </div>
        </div>

        <div class="scoreboard">
            <div class="score-card">
                <span>Player X</span>
                <span id="scoreX">0</span>
            </div>
            <div class="score-card">
                <span>Draws</span>
                <span id="scoreDraws">0</span>
            </div>
            <div class="score-card">
                <span>Player O</span>
                <span id="scoreO">0</span>
            </div>
        </div>

        <div class="status-bar" id="statusBar">Player X's Turn</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="restartBtn">New Round</button>
            <button class="btn-secondary" id="resetStatsBtn">Reset Stats</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusBar = document.getElementById('statusBar');
        const restartBtn = document.getElementById('restartBtn');
        const resetStatsBtn = document.getElementById('resetStatsBtn');
        const gameModeSelect = document.getElementById('gameMode');
        const aiDifficultySelect = document.getElementById('aiDifficulty');
        const difficultyRow = document.getElementById('difficultyRow');

        const scoreXEl = document.getElementById('scoreX');
        const scoreDrawsEl = document.getElementById('scoreDraws');
        const scoreOEl = document.getElementById('scoreO');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isGameActive = true;
        let scores = { X: 0, O: 0, draws: 0 };

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]            // Diagonals
        ];

        // Event Listeners
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', restartGame);
        resetStatsBtn.addEventListener('click', resetStats);
        gameModeSelect.addEventListener('change', handleModeChange);
        aiDifficultySelect.addEventListener('change', restartGame);

        function handleModeChange() {
            if (gameModeSelect.value === 'pvp') {
                difficultyRow.style.display = 'none';
            } else {
                difficultyRow.style.display = 'flex';
            }
            restartGame();
        }

        function handleCellClick(e) {
            const index = e.target.dataset.index;

            if (board[index] !== '' || !isGameActive) return;

            // If PvE mode and it's O's turn (AI's turn), block manual input
            if (gameModeSelect.value === 'pve' && currentPlayer === 'O') return;

            makeMove(index, currentPlayer);

            if (isGameActive && gameModeSelect.value === 'pve' && currentPlayer === 'O') {
                setTimeout(aiTurn, 400); // Slight delay for natural feel
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].innerText = player;
            cells[index].classList.add('filled', player.toLowerCase());

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningCombo = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCombo = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                statusBar.innerText = `Player ${currentPlayer} Wins!`;
                highlightWinningCells(winningCombo);
                updateScore(currentPlayer);
                return;
            }

            if (!board.includes('')) {
                isGameActive = false;
                statusBar.innerText = `It's a Draw!`;
                updateScore('draw');
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusBar.innerText = `Player ${currentPlayer}'s Turn`;
        }

        function highlightWinningCells(combo) {
            combo.forEach(index => {
                cells[index].classList.add('win');
            });
        }

        function updateScore(winner) {
            if (winner === 'X') scores.X++;
            else if (winner === 'O') scores.O++;
            else scores.draws++;

            scoreXEl.innerText = scores.X;
            scoreOEl.innerText = scores.O;
            scoreDrawsEl.innerText = scores.draws;
        }

        function aiTurn() {
            if (!isGameActive) return;

            const difficulty = aiDifficultySelect.value;
            let move;

            if (difficulty === 'easy') {
                move = getRandomMove();
            } else if (difficulty === 'medium') {
                // 50% chance optimal, 50% random
                move = Math.random() < 0.5 ? getBestMove() : getRandomMove();
            } else {
                move = getBestMove();
            }

            if (move !== null) {
                makeMove(move, 'O');
            }
        }

        function getRandomMove() {
            const emptyIndices = board
                .map((val, idx) => val === '' ? idx : null)
                .filter(val => val !== null);
            if (emptyIndices.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * emptyIndices.length);
            return emptyIndices[randomIndex];
        }

        // Minimax Algorithm for Unbeatable AI
        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < board.length; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = checkWinState(newBoard);
            if (result !== null) {
                if (result === 'O') return 10 - depth;
                if (result === 'X') return depth - 10;
                if (result === 'tie') return 0;
            }

            if (isMaximizing) {
                let maxScore = -Infinity;
                for (let i = 0; i < newBoard.length; i++) {
                    if (newBoard[i] === '') {
                        newBoard[i] = 'O';
                        let score = minimax(newBoard, depth + 1, false);
                        newBoard[i] = '';
                        maxScore = Math.max(score, maxScore);
                    }
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (let i = 0; i < newBoard.length; i++) {
                    if (newBoard[i] === '') {
                        newBoard[i] = 'X';
                        let score = minimax(newBoard, depth + 1, true);
                        newBoard[i] = '';
                        minScore = Math.min(score, minScore);
                    }
                }
                return minScore;
            }
        }

        function checkWinState(currentBoard) {
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[a] === currentBoard[c]) {
                    return currentBoard[a];
                }
            }
            if (!currentBoard.includes('')) {
                return 'tie';
            }
            return null;
        }

        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            isGameActive = true;
            statusBar.innerText = `Player X's Turn`;

            cells.forEach(cell => {
                cell.innerText = '';
                cell.className = 'cell';
            });
        }

        function resetStats() {
            scores = { X: 0, O: 0, draws: 0 };
            scoreXEl.innerText = 0;
            scoreOEl.innerText = 0;
            scoreDrawsEl.innerText = 0;
            restartGame();
        }
    </script>
</body>
</html>
