<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #00f0f0;
        }

        .game-container {
            display: flex;
            background: #2b2b2b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            gap: 20px;
        }

        canvas {
            background-color: #111;
            border: 2px solid #444;
            display: block;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 130px;
        }

        .panel {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            text-align: center;
        }

        .panel h2 {
            font-size: 0.9rem;
            margin: 0 0 10px 0;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel span {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        #nextCanvas {
            background: #111;
            border: 1px solid #333;
            margin: 0 auto;
            display: block;
        }

        .btn {
            background-color: #00f0f0;
            color: #111;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #00bcbc;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #888;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>TETRIS</h1>

    <div class="game-container">
        <!-- Main Game Board -->
        <canvas id="tetris" width="300" height="600"></canvas>

        <!-- Sidebar Info -->
        <div class="sidebar">
            <div>
                <div class="panel" style="margin-bottom: 15px;">
                    <h2>Next</h2>
                    <canvas id="nextCanvas" width="80" height="80"></canvas>
                </div>

                <div class="panel" style="margin-bottom: 15px;">
                    <h2>Score</h2>
                    <span id="score">0</span>
                </div>

                <div class="panel" style="margin-bottom: 15px;">
                    <h2>Level</h2>
                    <span id="level">1</span>
                </div>

                <div class="panel">
                    <h2>Lines</h2>
                    <span id="lines">0</span>
                </div>
            </div>

            <div>
                <button class="btn" id="startBtn">Play / Pause</button>
                <div class="controls-hint">
                    ← → : Move<br>
                    ↑ : Rotate<br>
                    ↓ : Soft Drop<br>
                    Space : Hard Drop
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextContext = nextCanvas.getContext('2d');

        // Scale canvas context to make blocks 30x30 pixels
        context.scale(30, 30);
        nextContext.scale(20, 20);

        const arena = createMatrix(10, 20);

        const player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            score: 0,
            lines: 0,
            level: 1,
        };

        const nextPlayer = {
            matrix: null,
        };

        const colors = [
            null,
            '#FF0D72', // T - Magenta
            '#0DC2FF', // I - Cyan
            '#0DFF72', // S - Green
            '#F538FF', // Z - Purple/Redish
            '#FF8E0D', // L - Orange
            '#FFE138', // O - Yellow
            '#3877FF', // J - Blue
        ];

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = false;
        let gameOver = false;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 1, 0],
                    [1, 1, 1],
                    [0, 0, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                    [0, 2, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 3, 3],
                    [3, 3, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [4, 4, 0],
                    [0, 4, 4],
                    [0, 0, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 5, 0],
                    [0, 5, 0],
                    [0, 5, 5],
                ];
            } else if (type === 'O') {
                return [
                    [6, 6],
                    [6, 6],
                ];
            } else if (type === 'J') {
                return [
                    [0, 7, 0],
                    [0, 7, 0],
                    [7, 7, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset, ctx = context) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Add subtle inner border for block styling
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = '#000';
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#111';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, { x: 0, y: 0 });
            drawMatrix(player.matrix, player.pos);

            // Draw next piece
            nextContext.fillStyle = '#111';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPlayer.matrix) {
                const offsetX = (4 - nextPlayer.matrix[0].length) / 2;
                const offsetY = (4 - nextPlayer.matrix.length) / 2;
                drawMatrix(nextPlayer.matrix, { x: offsetX, y: offsetY }, nextContext);
            }
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            if (nextPlayer.matrix === null) {
                const pieces = 'TJLOSZI';
                nextPlayer.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            }
            
            player.matrix = nextPlayer.matrix;
            const pieces = 'TJLOSZI';
            nextPlayer.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                gameOver = true;
                isPaused = true;
                alert('Game Over!');
            }
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 100 * player.level;
                player.lines++;
                rowCount *= 2;
            }

            player.level = Math.floor(player.lines / 10) + 1;
            dropInterval = Math.max(100, 1000 - (player.level - 1) * 90);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        function update(time = 0) {
            if (isPaused) return;

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        // Controls
        document.addEventListener('keydown', event => {
            if (gameOver || isPaused) return;

            if (event.keyCode === 37) { // Left arrow
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right arrow
                playerMove(1);
            } else if (event.keyCode === 40) { // Down arrow
                playerDrop();
            } else if (event.keyCode === 38) { // Up arrow
                playerRotate(1);
            } else if (event.keyCode === 32) { // Spacebar
                playerHardDrop();
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (gameOver) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                player.lines = 0;
                player.level = 1;
                gameOver = false;
                updateScore();
                playerReset();
            }

            isPaused = !isPaused;
            if (!isPaused) {
                lastTime = performance.now();
                update();
            }
        });

        // Initialize display
        playerReset();
        updateScore();
        draw();
    </script>
</body>
</html>
