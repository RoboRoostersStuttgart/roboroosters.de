<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Invaders</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.5rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        canvas {
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            background-color: #000;
        }
        .instructions {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SPACE INVADERS</h1>
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <div class="instructions">
        [A] / [D] or [◄] / [►] to Move &nbsp;|&nbsp; [SPACE] to Shoot &nbsp;|&nbsp; [R] to Restart
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- Web Audio API for Retro Sound Effects ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'invaderKilled') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.1);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'playerHit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // --- Game State Variables ---
        let score = 0;
        let lives = 3;
        let wave = 1;
        let gameOver = false;
        let gameWon = false;

        const keys = {
            left: false,
            right: false,
            space: false
        };

        // --- Game Objects ---
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 50,
            width: 40,
            height: 20,
            speed: 5
        };

        let bullets = [];
        let invaderBullets = [];
        let invaders = [];
        let particles = [];
        let bunkers = [];

        const invaderRows = 4;
        const invaderCols = 8;
        let invaderDirection = 1;
        let invaderSpeed = 1;
        let dropTimer = 0;

        // --- Initialization ---
        function initInvaders() {
            invaders = [];
            for (let r = 0; r < invaderRows; r++) {
                for (let c = 0; c < invaderCols; c++) {
                    invaders.push({
                        x: 60 + c * 50,
                        y: 60 + r * 40,
                        width: 30,
                        height: 20,
                        alive: true,
                        type: r === 0 ? 2 : 1 // Different visual tiers
                    });
                }
            }
        }

        function initBunkers() {
            bunkers = [];
            const bunkerCount = 3;
            const spacing = canvas.width / (bunkerCount + 1);
            for (let i = 0; i < bunkerCount; i++) {
                bunkers.push({
                    x: spacing * (i + 1) - 30,
                    y: canvas.height - 130,
                    width: 60,
                    height: 35,
                    health: 15 // degrades over time
                });
            }
        }

        function resetGame() {
            score = 0;
            lives = 3;
            wave = 1;
            gameOver = false;
            gameWon = false;
            invaderSpeed = 1;
            bullets = [];
            invaderBullets = [];
            particles = [];
            player.x = canvas.width / 2 - 20;
            initInvaders();
            initBunkers();
        }

        function nextWave() {
            wave++;
            invaderSpeed += 0.5;
            bullets = [];
            invaderBullets = [];
            initInvaders();
        }

        // --- Particle System ---
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    alpha: 1,
                    color: color
                });
            }
        }

        // --- Input Listeners ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') {
                if (!keys.space && !gameOver && !gameWon) {
                    // Fire bullet
                    bullets.push({
                        x: player.x + player.width / 2 - 2,
                        y: player.y,
                        width: 4,
                        height: 12,
                        speed: 7
                    });
                    playSound('shoot');
                }
                keys.space = true;
                e.preventDefault();
            }
            if (e.code === 'KeyR' && (gameOver || gameWon)) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space') keys.space = false;
        });

        // --- Update Logic ---
        function update() {
            if (gameOver || gameWon) return;

            // Player movement
            if (keys.left && player.x > 10) player.x -= player.speed;
            if (keys.right && player.x < canvas.width - player.width - 10) player.x += player.speed;

            // Update Player Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                // Out of bounds check
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Check collision with Invaders
                let bulletRemoved = false;
                for (let inv of invaders) {
                    if (inv.alive &&
                        bullets[i] &&
                        bullets[i].x < inv.x + inv.width &&
                        bullets[i].x + bullets[i].width > inv.x &&
                        bullets[i].y < inv.y + inv.height &&
                        bullets[i].y + bullets[i].height > inv.y) {
                        
                        inv.alive = false;
                        score += inv.type === 2 ? 20 : 10;
                        createParticles(inv.x + inv.width / 2, inv.y + inv.height / 2, '#0f0');
                        playSound('invaderKilled');
                        bullets.splice(i, 1);
                        bulletRemoved = true;
                        break;
                    }
                }
                if (bulletRemoved) continue;

                // Check collision with Bunkers
                for (let bunker of bunkers) {
                    if (bunker.health > 0 &&
                        bullets[i] &&
                        bullets[i].x < bunker.x + bunker.width &&
                        bullets[i].x + bullets[i].width > bunker.x &&
                        bullets[i].y < bunker.y + bunker.height &&
                        bullets[i].y + bullets[i].height > bunker.y) {
                        
                        bunker.health--;
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Update Invader Bullets
            for (let i = invaderBullets.length - 1; i >= 0; i--) {
                invaderBullets[i].y += invaderBullets[i].speed;
                if (invaderBullets[i].y > canvas.height) {
                    invaderBullets.splice(i, 1);
                    continue;
                }

                // Check collision with Player
                let ib = invaderBullets[i];
                if (ib &&
                    ib.x < player.x + player.width &&
                    ib.x + ib.width > player.x &&
                    ib.y < player.y + player.height &&
                    ib.y + ib.height > player.y) {
                    
                    invaderBullets.splice(i, 1);
                    lives--;
                    createParticles(player.x + player.width / 2, player.y + player.height / 2, '#f00');
                    playSound('playerHit');
                    if (lives <= 0) {
                        gameOver = true;
                    }
                    continue;
                }

                // Check collision with Bunkers
                for (let bunker of bunkers) {
                    if (bunker.health > 0 &&
                        invaderBullets[i] &&
                        invaderBullets[i].x < bunker.x + bunker.width &&
                        invaderBullets[i].x + invaderBullets[i].width > bunker.x &&
                        invaderBullets[i].y < bunker.y + bunker.height &&
                        invaderBullets[i].y + invaderBullets[i].height > bunker.y) {
                        
                        bunker.health--;
                        invaderBullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Move Invaders
            let edgeReached = false;
            for (let inv of invaders) {
                if (!inv.alive) continue;
                inv.x += invSpeed * invaderDirection;

                if (inv.x + inv.width > canvas.width - 20 || inv.x < 20) {
                    edgeReached = true;
                }

                // Check if invader reaches player level
                if (inv.y + inv.height >= player.y) {
                    gameOver = true;
                }
            }

            if (edgeReached) {
                invaderDirection *= -1;
                for (let inv of invaders) {
                    inv.y += 15;
                }
            }

            // Invader firing logic
            if (Math.random() < 0.02 + (wave * 0.005)) {
                let aliveInvaders = invaders.filter(inv => inv.alive);
                if (aliveInvaders.length > 0) {
                    let shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
                    invaderBullets.push({
                        x: shooter.x + shooter.width / 2 - 2,
                        y: shooter.y + shooter.height,
                        width: 4,
                        height: 10,
                        speed: 3 + wave * 0.5
                    });
                }
            }

            // Check Win condition (All invaders dead)
            if (invaders.every(inv => !inv.alive)) {
                nextWave();
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // --- Render Logic ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw UI Stats
            ctx.fillStyle = '#fff';
            ctx.font = '14px Courier New';
            ctx.fillText(`SCORE: ${score}`, 20, 30);
            ctx.fillText(`LIVES: ${lives}`, canvas.width - 100, 30);
            ctx.fillText(`WAVE: ${wave}`, canvas.width / 2 - 30, 30);

            ctx.strokeStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(0, 45);
            ctx.lineTo(canvas.width, 45);
            ctx.stroke();

            // Draw Player
            ctx.fillStyle = '#0f0';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(player.x + player.width / 2 - 4, player.y - 6, 8, 6); // Cannon nozzle

            // Draw Player Bullets
            ctx.fillStyle = '#fff';
            for (let b of bullets) {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }

            // Draw Invader Bullets
            ctx.fillStyle = '#f00';
            for (let ib of invaderBullets) {
                ctx.fillRect(ib.x, ib.y, ib.width, ib.height);
            }

            // Draw Invaders
            for (let inv of invaders) {
                if (!inv.alive) continue;
                ctx.fillStyle = inv.type === 2 ? '#ff00ff' : '#00ffff';
                ctx.fillRect(inv.x, inv.y, inv.width, inv.height);
                
                // Simple pixel eyes for retro effect
                ctx.fillStyle = '#000';
                ctx.fillRect(inv.x + 6, inv.y + 6, 4, 4);
                ctx.fillRect(inv.x + inv.width - 10, inv.y + 6, 4, 4);
            }

            // Draw Bunkers
            for (let bunker of bunkers) {
                if (bunker.health > 0) {
                    ctx.fillStyle = `rgba(0, 255, 0, ${bunker.health / 15})`;
                    ctx.fillRect(bunker.x, bunker.y, bunker.width, bunker.height);
                }
            }

            // Draw Particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, 3, 3);
            }
            ctx.globalAlpha = 1.0;

            // Game Over / Win Screens
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f00';
                ctx.font = 'bold 30px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '14px Courier New';
                ctx.fillText('PRESS [R] TO RESTART', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
            }
        }

        // --- Main Game Loop ---
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize and Start
        resetGame();
        loop();
    </script>
</body>
</html>
